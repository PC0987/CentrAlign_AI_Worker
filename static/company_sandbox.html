<!doctype html>
<html><head><meta charset="utf-8"><title>CentrAlign Company Sandbox</title>
<style>body{font-family:Arial;margin:36px;background:#f7f7f8;color:#222}.card{background:#fff;padding:22px;border-radius:14px;max-width:960px;margin:auto;box-shadow:0 3px 15px #0001}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}button{padding:9px 14px;border-radius:8px;border:0;background:#111;color:#fff;cursor:pointer}input{padding:8px;width:320px;margin:6px 0}.muted{color:#666}</style></head>
<body><div id="app"></div>
<script>
let apCount=0; const erpRecords={};
const invoices=[
{id:'INV-ACME-1002',vendor:'Acme Corporation',date:'2026-10-07',amount:4820.00,due:'2026-11-06',file:'acme_october_1002.pdf'},
{id:'INV-ACME-1001',vendor:'Acme Corporation',date:'2026-09-12',amount:4210.00,due:'2026-10-12',file:'acme_september_1001.pdf'},
{id:'INV-ZENITH-883',vendor:'Zenith Systems',date:'2026-10-05',amount:14850.00,due:'2026-11-04',file:'zenith_october_883.pdf'}
];
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(){
 const p=location.hash.replace(/^#/,'')||'inbox';
 if(p==='inbox') return renderInbox();
 if(p.startsWith('invoice/')) return renderInvoice(p.split('/')[1]);
 if(p==='erp-new') return renderERPNew();
 if(p.startsWith('erp/')) return renderERPRecord(p.split('/')[1]);
 return renderInbox();
}
function renderInbox(){
 document.getElementById('app').innerHTML=`<div class='card'><h1>Company Invoice Inbox</h1><p class='muted'>Simulated source system used for the autonomous worker demo.</p><table><tr><th>Invoice</th><th>Vendor</th><th>Date</th><th>Amount</th><th>Due</th></tr>${invoices.map(x=>`<tr data-invoice data-id='${x.id}' data-vendor='${x.vendor}' data-date='${x.date}' data-amount='${x.amount}' data-due='${x.due}'><td><a data-invoice-id='${x.id}' href='#invoice/${x.id}'>${x.id}</a></td><td>${esc(x.vendor)}</td><td>${x.date}</td><td>₹${x.amount.toLocaleString()}</td><td>${x.due}</td></tr>`).join('')}</table><p><a href='#erp-new'>Go to internal ERP</a></p></div>`;
}
function renderInvoice(id){
 const x=invoices.find(i=>i.id===id); if(!x){document.getElementById('app').innerHTML='<div class=card>Invoice not found</div>';return}
 document.getElementById('app').innerHTML=`<div class='card'><h1>Invoice Detail</h1><p><b>Invoice ID:</b> <span data-field='invoice-id'>${x.id}</span></p><p><b>Vendor:</b> <span data-field='vendor'>${esc(x.vendor)}</span></p><p><b>Amount:</b> <span data-field='amount'>₹${x.amount.toLocaleString()}</span></p><p><b>Due date:</b> <span data-field='due-date'>${x.due}</span></p><p><b>Source file:</b> ${x.file}</p><a href='#inbox'>Back to inbox</a></div>`;
}
function renderERPNew(){
 document.getElementById('app').innerHTML=`<div class='card'><h1>Internal Accounts Payable</h1><form id='erp-form'><label>Vendor</label><br><input id='vendor' name='vendor'><br><label>Invoice ID</label><br><input id='invoice_id' name='invoice_id'><br><label>Amount</label><br><input id='amount' name='amount'><br><label>Due date</label><br><input id='due_date' name='due_date'><br><button type='submit'>Create payable</button></form><div id='msg'></div></div>`;
 document.getElementById('erp-form').addEventListener('submit',e=>{e.preventDefault();let id='AP-'+String(++apCount).padStart(4,'0');let r={id,vendor:document.getElementById('vendor').value,invoice_id:document.getElementById('invoice_id').value,amount:Number(document.getElementById('amount').value),due_date:document.getElementById('due_date').value,created:true};erpRecords[id]=r;document.getElementById('msg').innerHTML=`<p data-created='true'>Payable created successfully.</p><p>ERP ID: <span data-field='erp-id'>${id}</span></p><a href='#erp/${id}'>Open record</a>`;});
}
function renderERPRecord(id){
 const r=erpRecords[id] || null; if(!r){document.getElementById('app').innerHTML='<div class=card>ERP record not found</div>';return}
 document.getElementById('app').innerHTML=`<div class='card'><h1>Accounts Payable Record</h1><p>ERP ID: <span data-field='erp-id'>${r.id}</span></p><p>Vendor: <span data-field='vendor'>${esc(r.vendor)}</span></p><p>Invoice ID: <span data-field='invoice-id'>${esc(r.invoice_id)}</span></p><p>Amount: <span data-field='amount'>₹${r.amount.toLocaleString()}</span></p><p>Due date: <span data-field='due-date'>${r.due_date}</span></p></div>`;
}
window.addEventListener('hashchange',render); render();
</script></body></html>
