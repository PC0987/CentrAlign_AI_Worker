<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CentrAlign AI Worker</title>
  <style>
    body{font-family:Inter,system-ui,Arial;margin:0;background:#f4f6f8;color:#17202a}.wrap{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px rgba(0,0,0,.06)}h1{margin-bottom:4px}.muted{color:#6b7280}textarea{width:100%;min-height:105px;border:1px solid #d1d5db;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 17px;background:#111827;color:white;font-weight:700;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}.row{display:flex;gap:10px;align-items:center}.stage{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;margin-top:6px}.done .dot{background:#16a34a}.warn .dot{background:#d97706}.error .dot{background:#dc2626}.code{background:#0b1020;color:#dbeafe;border-radius:12px;padding:14px;overflow:auto;white-space:pre-wrap}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff;font-size:13px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>CentrAlign Autonomous AI Worker</h1>
    <p class="muted">Goal → Understand → Plan → Execute → Observe → Adapt → Verify → Complete</p>
    <textarea id="task">Find the latest invoice from Acme Corporation, extract the amount and due date, enter it into our internal system, and tell me once it is done.</textarea>
    <div class="row" style="margin-top:12px"><button id="run">Run worker</button><button class="secondary" id="reset">Reset sandbox</button><span id="status" class="pill">idle</span></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Execution trace</h2><div id="trace" class="muted">Run a task to see the agent's decisions and observations.</div></div>
    <div class="card"><h2>Outcome</h2><div id="outcome" class="muted">No task executed yet.</div></div>
  </div>
</div>
<script>
const trace=document.getElementById('trace'), outcome=document.getElementById('outcome'), status=document.getElementById('status');
function render(data){
 status.textContent=data.status;
 trace.innerHTML='';
 for(const e of (data.events||[])){
   const d=document.createElement('div'); d.className='stage '+(e.stage==='recover'?'warn':'done');
   const dt=document.createElement('div'); dt.className='dot'; d.appendChild(dt);
   const c=document.createElement('div'); c.innerHTML=`<b>${e.stage}</b><div>${e.message}</div>`; if(e.data) {const p=document.createElement('div'); p.className='muted'; p.textContent=JSON.stringify(e.data); c.appendChild(p)} d.appendChild(c); trace.appendChild(d);
 }
 if(data.status==='awaiting_approval'){
   outcome.innerHTML=`<p><b>Human approval required.</b></p><p>${data.result.reason}</p><button id="approve">Approve & continue</button>`;
   document.getElementById('approve').onclick=async()=>{const r=await fetch('/api/runs/'+data.id+'/approve',{method:'POST'}); render(await r.json())};
 }else if(data.status==='completed'){
   outcome.innerHTML=`<p><b>Completed.</b></p><p>Invoice: <b>${data.result.invoice.id}</b></p><p>Vendor: ${data.result.invoice.vendor}</p><p>Amount: ₹${data.result.invoice.amount.toLocaleString()}</p><p>Due: ${data.result.invoice.due_date}</p><p>ERP record: <b>${data.result.erp_record_id}</b></p><p><a href="${data.result.evidence.invoice_page}" target="_blank">Invoice evidence</a> · <a href="${data.result.evidence.erp_page}" target="_blank">ERP evidence</a></p><pre class="code">${JSON.stringify(data.result,null,2)}</pre>`;
 }else if(data.status==='failed'){
   outcome.innerHTML=`<p><b>Failed.</b></p><pre class="code">${JSON.stringify(data.result,null,2)}</pre>`;
 }else outcome.innerHTML='<p>Running…</p>';
}

document.getElementById('run').onclick=async()=>{status.textContent='running'; outcome.textContent='Starting...'; const task=document.getElementById('task').value; const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task})}); render(await r.json())};
document.getElementById('reset').onclick=async()=>{await fetch('/api/reset',{method:'POST'});status.textContent='idle';trace.textContent='Sandbox reset.';outcome.textContent='No task executed yet.'};
</script>
</body>
</html>
